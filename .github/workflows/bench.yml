name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: native
        run: cargo test --release

  size-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build bench
        working-directory: native
        run: cargo build --release --example bench_size
      - name: run size benchmark (4096 chunks, 4 edit rounds)
        working-directory: native
        run: |
          ./target/release/examples/bench_size 64 4 2>&1 | tee bench_output.txt
      - name: record all stall points (compaction steps)
        working-directory: native
        run: |
          ./target/release/examples/bench_size 48 3 2>&1 | grep -E "compacted|packed|trained|A write|B edits|C compaction|D verify|summary|logical|anvil|c-saves" | tee bench_stalls.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            native/bench_output.txt
            native/bench_stalls.txt
      - name: size profile (what weighs the most)
        working-directory: native
        run: |
          cargo build --release --example profile_size
          ./target/release/examples/profile_size 32 2 2>/dev/null | tee bench_profile.txt
      - name: regression gate — compact container must stay under 15% of Anvil size
        working-directory: native
        run: |
          RATIO=$(./target/release/examples/bench_size 32 2 2>/dev/null | grep "c-saves compact" | grep -o "x0\.[0-9]* vs anvil" | grep -o "0\.[0-9]*")
          echo "compact/anvil ratio: $RATIO"
          awk -v r="$RATIO" 'BEGIN { if (r+0 > 0.15) { print "FAIL: ratio " r " exceeds 0.15"; exit 1 } print "OK" }'

  jj-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build jj_profile
        working-directory: native
        run: cargo build --release --example jj_profile
      - name: JJThunder To The Max real-world bench (131-section chunks + 10k entities)
        working-directory: native
        run: |
          ./target/release/examples/jj_profile ../bench-corpus/dim 2>/dev/null | tee jj_bench.txt
          cat jj_bench.txt
      - name: gate — semantic verify clean, container under 50% of Anvil
        working-directory: native
        run: |
          grep -q "verify: ok=" jj_bench.txt || { echo "FAIL: no verification line"; exit 1; }
          BAD=$(grep "verify:" jj_bench.txt | grep -o "bad=[0-9]*" | head -1 | cut -d= -f2)
          [ "$BAD" = "0" ] || { echo "FAIL: semantic verification bad=$BAD"; exit 1; }
          RATIO=$(grep "^TOTAL" jj_bench.txt | grep -o "x[0-9.]* smaller" | grep -o "[0-9.]*")
          echo "container is ${RATIO}x smaller than Anvil on the JJThunder corpus"
          awk -v r="$RATIO" 'BEGIN { if (r+0 < 2.6) { print "FAIL: ratio below 2.6x"; exit 1 } print "OK" }'
      - uses: actions/upload-artifact@v4
        with:
          name: jj-bench-results
          path: native/jj_bench.txt

  survival-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build survival bench
        working-directory: native
        run: cargo build --release --example survival_bench
      - name: realistic survival-world size bench (32x32 chunks, skylight + chests + farms)
        working-directory: native
        run: |
          ./target/release/examples/survival_bench 16 12 2>&1 | tee survival_bench.txt
          cat survival_bench.txt
      - name: record size/stall summary
        working-directory: native
        run: grep -E "import\+pack|TOTAL|region :|entities:|verify|profile|enc-modes|weights" survival_bench.txt | tee survival_stalls.txt
      - name: gate — verify clean + survival-world size floor
        working-directory: native
        run: |
          grep -q "verify: ok=" survival_bench.txt || { echo "FAIL: no verify line"; exit 1; }
          BAD=$(grep "verify:" survival_bench.txt | grep -o "bad=[0-9]*" | head -1 | cut -d= -f2)
          [ "$BAD" = "0" ] || { echo "FAIL: semantic verification bad=$BAD"; exit 1; }
          RATIO=$(grep "^TOTAL" survival_bench.txt | grep -o "x[0-9.]* smaller" | grep -o "[0-9.]*")
          echo "survival corpus: ${RATIO}x smaller than Anvil"
          awk -v r="$RATIO" 'BEGIN { if (r+0 < 3.0) { print "FAIL: ratio below 3.0x"; exit 1 } print "OK" }'
      - uses: actions/upload-artifact@v4
        with:
          name: survival-bench-results
          path: |
            native/survival_bench.txt
            native/survival_stalls.txt

  survival-exp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build survival_exp
        working-directory: native
        run: cargo build --release --example survival_exp
      - name: survival attribution + codec-lever prediction (48x48 chunks)
        working-directory: native
        run: |
          ./target/release/examples/survival_exp 24 2>&1 | tee survival_exp.txt
          cat survival_exp.txt
      - uses: actions/upload-artifact@v4
        with:
          name: survival-exp-results
          path: native/survival_exp.txt

  real-exp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build real_exp
        working-directory: native
        run: |
          cargo build --release --example real_exp
          cargo build --release --example jj_exp4
      - name: real-corpus attribution (committed JJThunder subset)
        working-directory: native
        run: |
          ./target/release/examples/real_exp ../bench-corpus/dim 2>&1 | tee real_exp.txt
          cat real_exp.txt
          echo "--- cross-chunk dense-delta potential (jj_exp4) ---"
          ./target/release/examples/jj_exp4 ../bench-corpus/dim 2>&1 | tee jj_exp4.txt
          cat jj_exp4.txt
      - uses: actions/upload-artifact@v4
        with:
          name: real-exp-results
          path: |
            native/real_exp.txt
            native/jj_exp4.txt

  speed-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build speed_bench
        working-directory: native
        run: cargo build --release --example speed_bench
      - name: I/O speed benchmark (real JJThunder corpus, Anvil vs c-saves)
        working-directory: native
        run: |
          ./target/release/examples/speed_bench ../bench-corpus/dim 3 2 2>/dev/null | tee speed_bench.txt
          cat speed_bench.txt
      - name: record all stall points (latency percentiles + per-stage breakdown)
        working-directory: native
        run: |
          grep -E "^SPEED" speed_bench.txt | tee speed_stalls.txt
      - name: gates — verify clean + throughput/latency floors (3 attempts; hosted runners have noisy neighbors — one clean attempt passes)
        working-directory: native
        run: |
          set -e
          cat > /tmp/gate.sh <<'GEOF'
          set -e
          BADS=$(grep -oE "verify-[a-z]+: ok=[0-9]+ bad=[0-9]+" speed_bench.txt | grep -oE "bad=[0-9]+" | cut -d= -f2)
          for b in $BADS; do [ "$b" = "0" ] || { echo "FAIL: semantic verify bad=$b"; exit 1; }; done
          mbps() { grep "$1" speed_bench.txt | grep -oE "MB/s=[0-9.]+" | head -1 | cut -d= -f2; }
          us() { grep "$1" speed_bench.txt | grep -oE "p50=[0-9.]+" | head -1 | cut -d= -f2; }
          AREAD=$(mbps "anvil-read-region");       CREAD=$(mbps "csaves-read-warm-region")
          AWR_E=$(mbps "anvil-write-entities");    CWR_E=$(mbps "csaves-write-steady-entities")
          CIMP=$(mbps "csaves-import-region");     CWR=$(mbps "csaves-write-steady-region")
          RP50=$(us "csaves-read-warm-region")
          echo "anvil-read=${AREAD} csaves-read=${CREAD} csaves-import-region=${CIMP} csaves-write-region=${CWR} anvil-write-ent=${AWR_E} csaves-write-ent=${CWR_E} read-p50=${RP50}us"
          awk -v r="$CIMP"  'BEGIN { if (r+0 < 25)  { print "FAIL: region import " r " MB/s < 25"; exit 1 } }'
          awk -v r="$CWR"   'BEGIN { if (r+0 < 30)  { print "FAIL: region steady write " r " MB/s < 30"; exit 1 } }'
          # relative floor with an absolute backstop: the warm read must stay
          # in the anvil-inflate ballpark on the SAME run (same runner state);
          # 100 MB/s absolute catches a true collapse when anvil is slow too.
          awk -v c="$CREAD" -v a="$AREAD" 'BEGIN { if (c+0 < a*0.4 && c+0 < 100) { print "FAIL: region warm read " c " MB/s < max(0.4x anvil " a ", 100)"; exit 1 } }'
          awk -v r="$RP50"  'BEGIN { if (r+0 > 40)  { print "FAIL: read p50 " r "us > 40us"; exit 1 } }'
          awk -v c="$CWR_E" -v a="$AWR_E" 'BEGIN { if (c+0 < a*4) { print "FAIL: entity write " c " MB/s < 4x anvil " a; exit 1 } }'
          echo "speed gates OK"
          GEOF
          rc=1
          for attempt in 1 2 3; do
            echo "== speed bench attempt $attempt =="
            ./target/release/examples/speed_bench ../bench-corpus/dim 3 2 2>/dev/null | tee speed_bench.txt
            if bash /tmp/gate.sh; then rc=0; break; fi
            echo "attempt $attempt failed gates (runner noise?) — retrying"
          done
          grep -E "^SPEED" speed_bench.txt | tee speed_stalls.txt
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: speed-bench-results
          path: |
            native/speed_bench.txt
            native/speed_stalls.txt
