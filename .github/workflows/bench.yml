name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: native
        run: cargo test --release

  size-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build bench
        working-directory: native
        run: cargo build --release --example bench_size
      - name: run size benchmark (4096 chunks, 4 edit rounds)
        working-directory: native
        run: |
          ./target/release/examples/bench_size 64 4 2>&1 | tee bench_output.txt
      - name: record all stall points (compaction steps)
        working-directory: native
        run: |
          ./target/release/examples/bench_size 48 3 2>&1 | grep -E "compacted|packed|trained|A write|B edits|C compaction|D verify|summary|logical|anvil|c-saves" | tee bench_stalls.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            native/bench_output.txt
            native/bench_stalls.txt
            native/bench_pristine.txt
            native/bench_pristine_fresh.txt
            native/bench_pristine_audit.txt
            native/bench_export_roundtrip.txt
            native/bench_scale_probe.txt
      - name: size profile (what weighs the most)
        working-directory: native
        run: |
          cargo build --release --example profile_size
          ./target/release/examples/profile_size 32 2 2>/dev/null | tee bench_profile.txt
      - name: regression gate — compact container must stay under 15% of Anvil size
        working-directory: native
        run: |
          RATIO=$(./target/release/examples/bench_size 32 2 2>/dev/null | grep "c-saves compact" | grep -o "x0\.[0-9]* vs anvil" | grep -o "0\.[0-9]*")
          echo "compact/anvil ratio: $RATIO"
          awk -v r="$RATIO" 'BEGIN { if (r+0 > 0.15) { print "FAIL: ratio " r " exceeds 0.15"; exit 1 } print "OK" }'
      - name: pristine pure-pregen gate — huge-world semantics (v0.9.45)
        working-directory: native
        run: |
          CSAVES_PRISTINE=1 ./target/release/examples/bench_size 96 0 2>&1 | tee bench_pristine.txt
          PRISTINE_RATIO=$(grep "c-saves compact" bench_pristine.txt | grep -o "x0\.[0-9]* vs anvil" | grep -o "0\.[0-9]*")
          PRISTINE_N=$(grep "pristine contracts skipped" bench_pristine.txt | grep -o "([0-9]*" | tr -d "(")
          echo "pure-pregen compact/anvil ratio: $PRISTINE_RATIO, pristine sampled: $PRISTINE_N"
          awk -v r="$PRISTINE_RATIO" 'BEGIN { if (r+0 > 0.02) { print "FAIL: pristine pure-pregen ratio " r " exceeds 0.02"; exit 1 } print "OK" }'
          awk -v n="$PRISTINE_N" 'BEGIN { if (n+0 < 100) { print "FAIL: pristine verify sample " n " below 100"; exit 1 } print "OK" }'
      - name: pristine shim-evidence gate — the residual risk stays closed (v0.9.47)
        working-directory: native
        run: |
          cargo build --release --example pristine_fresh_probe
          CSAVES_PRISTINE=1 ./target/release/examples/pristine_fresh_probe 2>&1 | tee bench_pristine_fresh.txt
          # A) the gate stores every not-fresh first write honestly (the
          #    pre-first-save edit survives regeneration)
          grep -q "edits_surviving=728/728" bench_pristine_fresh.txt || { echo "FAIL: not-fresh edits did not all survive"; exit 1; }
          # B) the pre-0.9.47 hazard demo still names the reverted class
          grep -q "edits_reverted_on_regen=728/728" bench_pristine_fresh.txt || { echo "FAIL: hazard demo missing"; exit 1; }
          # C) pure-pregen invariance: fresh evidence keeps the huge-world win
          awk -v r="$(grep -o 'x0\.[0-9]* vs anvil' bench_pristine_fresh.txt | tail -1 | grep -o '0\.[0-9]*')" 'BEGIN { if (r+0 > 0.02) { print "FAIL: pure-pregen invariance ratio " r " exceeds 0.02"; exit 1 } print "OK" }'
      - name: pristine audit gate — contract legends re-derive from the corpus (v0.9.48)
        working-directory: native
        run: |
          cargo build --release --example pristine_audit
          # the end-to-end operator flow: import -> audit -> ship. The tool
          # stages a copy (the import drains its source), forms contracts
          # through the production import, then re-derives every legend
          # from the untouched corpus bytes + replays the relight session.
          rm -rf /tmp/ci-audit-store
          CSAVES_PRISTINE=1 CSAVES_PRISTINE_IMPORT=1 \
            ./target/release/examples/pristine_audit /tmp/ci-audit-store \
            --corpus ../bench-corpus/dim --import --session 2>&1 | tee bench_pristine_audit.txt
          # the tool exits non-zero on drift/flips; these pins also catch a
          # silently degraded legend formation or session model
          grep -q "contracts 728 (canon legends 728, raw-only 0)" bench_pristine_audit.txt || { echo "FAIL: contract inventory"; exit 1; }
          grep -q "legend check: raw_match=728 canon_match=0 drift=0" bench_pristine_audit.txt || { echo "FAIL: legend drift"; exit 1; }
          grep -q "session check: kept=728 flipped=0" bench_pristine_audit.txt || { echo "FAIL: session prediction"; exit 1; }
          grep -q "verdict: PASS" bench_pristine_audit.txt || { echo "FAIL: audit verdict"; exit 1; }
      - name: export roundtrip gate — the export path accounts for every key (v0.9.49)
        working-directory: native
        run: |
          cargo build --release --example export_roundtrip
          # container -> Anvil -> container: Phase A pins flag-off
          # losslessness (byte-identical payloads), Phase B pins the
          # mixed-state convergence (export == stored part exactly,
          # contracted keys absent by design, re-import re-contracts with
          # exact legends). Exit non-zero on any invariant violation.
          ./target/release/examples/export_roundtrip 2>&1 | tee bench_export_roundtrip.txt
          grep -q "A flag-off: 728 chunks imported" bench_export_roundtrip.txt || { echo "FAIL: flag-off losslessness"; exit 1; }
          grep -q "re-imported byte-identical 728/728" bench_export_roundtrip.txt || { echo "FAIL: byte identity"; exit 1; }
          grep -q "export 8 chunks + 720 pristine_skipped" bench_export_roundtrip.txt || { echo "FAIL: mixed-state export classification"; exit 1; }
          grep -q "re-import contracted 8/8 with exact legends" bench_export_roundtrip.txt || { echo "FAIL: legend convergence"; exit 1; }
          grep -q "=== export roundtrip: PASS ===" bench_export_roundtrip.txt || { echo "FAIL: roundtrip verdict"; exit 1; }
      - name: scale probe gate — the -90% promise at 262,144-chunk world scale (v0.9.51)
        working-directory: native
        run: |
          cargo build --release --example scale_probe
          # A structurally realistic pregen world (the same Tectonic-like
          # generator the size benchmarks use) at 512x512 chunks = 256
          # region files = 8192x8192 blocks: vanilla zlib-6 .mca baseline
          # vs the container after a full pristine import (262,144
          # contracts) + 256 honest player edits (one per region). The
          # probe asserts container/anvil < x0.10 itself (panic = red);
          # the greps pin the exact world size, the export accounting
          # identity and the re-import legend semantics.
          ./target/release/examples/scale_probe 16 2>&1 | tee bench_scale_probe.txt
          grep -q "scale world: 256 regions x 1024 chunks = 262144 chunks" bench_scale_probe.txt || { echo "FAIL: world scale wrong"; exit 1; }
          grep -q "scale ratio gate: PASS (< x0.10 = the -90% promise holds at world scale)" bench_scale_probe.txt || { echo "FAIL: -90% weight promise"; exit 1; }
          grep -q "scale export accounting: 256 stored + 261888 pristine_skipped + 0 lost = 262144 keys" bench_scale_probe.txt || { echo "FAIL: export accounting identity"; exit 1; }
          grep -q "scale reimport: 256/256 edits re-contracted" bench_scale_probe.txt || { echo "FAIL: re-import legends"; exit 1; }
          # v0.9.52: the arithmetic ladder on the same world — raw-only
          # 17 B/chunk legends, then the region-assert tier (ONE 136 B
          # record per region, ~0.13 B/chunk): no per-chunk legends at
          # all, any re-save of an asserted key stores honestly.
          grep -q "of anvil (17 B/chunk legends, 262144 contracts)" bench_scale_probe.txt || { echo "FAIL: raw-only tier"; exit 1; }
          grep -q "scale region-assert: 256 region record(s) replace 262144 per-chunk legends" bench_scale_probe.txt || { echo "FAIL: region record count"; exit 1; }
          grep -q "scale region gate: PASS (< x0.001 — the harsher arithmetic holds)" bench_scale_probe.txt || { echo "FAIL: region-assert arithmetic"; exit 1; }
          grep -q "scale region verification cost: 2 re-save(s) stored honestly (identical included), 262142 of 262144 slots still asserted" bench_scale_probe.txt || { echo "FAIL: region verification cost semantics"; exit 1; }
          grep -q "scale region export accounting: 2 stored + 262142 pristine_skipped + 0 lost = 262144 keys" bench_scale_probe.txt || { echo "FAIL: region export accounting"; exit 1; }
          grep -q "scale region reimport: 2/2 edits re-asserted at region grain" bench_scale_probe.txt || { echo "FAIL: region re-import"; exit 1; }
          # v0.9.54: the PROVEN assert — before any tier may claim a chunk
          # is seed-reproducible, every chunk on disk is canonically
          # hash-compared against the seed regeneration (canonical_
          # contract_hash: order-free, strip-invariant — NBT byte order is
          # NOT stable across serializations, content is), and the
          # surviving legends are checked through the container against
          # the same seed hashes. The divergent-chunk gate proves the
          # negative: a chunk whose content diverged from the seed is
          # caught at the gate, refused the assert, and stored honestly
          # through the not-fresh evidence path — nothing lost, nothing
          # silently reverted to seed content.
          grep -q "scale seed verify: 262144/262144 chunks on disk match seed regeneration" bench_scale_probe.txt || { echo "FAIL: seed verification gate"; exit 1; }
          grep -q "scale legend truth: 261888/261888 surviving legends equal the seed hash" bench_scale_probe.txt || { echo "FAIL: legend truth"; exit 1; }
          grep -q "scale divergence gate: chunk (259,272) rejected — disk hash != seed hash" bench_scale_probe.txt || { echo "FAIL: divergent chunk not caught"; exit 1; }
          grep -q "scale divergence protocol: 262143 slots asserted (verified against the seed), 1 divergent chunk stored honestly" bench_scale_probe.txt || { echo "FAIL: divergence protocol"; exit 1; }
          grep -q "scale restore identity: 262143 seed-restored + 1 container-stored = 262144/262144 restored, 0 lost" bench_scale_probe.txt || { echo "FAIL: restore identity"; exit 1; }
          # v0.9.53: the POI store is a DERIVED index — vanilla rebuilds it
          # from chunk block states on load (PoiManager.checkConsistency-
          # WithBlocks). The elision pins 0 B persisted (session scratchpad
          # only) and the whole-world arithmetic at the flagship tiers.
          grep -q "poi vanilla weight: 256 file(s), 10496 poi chunks," bench_scale_probe.txt || { echo "FAIL: poi vanilla corpus"; exit 1; }
          grep -q "poi container elided: 0.0 KiB — 0 B persisted" bench_scale_probe.txt || { echo "FAIL: poi elision weight"; exit 1; }
          grep -q "poi elide reopen: 0/" bench_scale_probe.txt || { echo "FAIL: scratchpad is not RAM-only"; exit 1; }
          grep -q "poi elision gate: PASS (vanilla poi/ -> 0 persisted)" bench_scale_probe.txt || { echo "FAIL: poi elision gate"; exit 1; }
          grep -q "scale total gate: PASS (< x0.0001 — the whole-world arithmetic)" bench_scale_probe.txt || { echo "FAIL: whole-world arithmetic"; exit 1; }
          grep -q "=== scale probe: PASS ===" bench_scale_probe.txt || { echo "FAIL: scale verdict"; exit 1; }

  play-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build play probe
        working-directory: native
        run: cargo build --release --example play_probe
      - name: play gate — the server plays from the container, restart included (v0.9.60)
        working-directory: native
        run: |
          # The live path the Paper shim actually serves: Registry::attach
          # (the natives' own registry), write_chunk_fresh (the freshness
          # evidence channel n_write_chunk uses), read_chunk (None =
          # ReadResult::NO_DATA -> Paper regenerates), sync (nEndSave).
          # Session: worldgen burst (fresh evidence -> contracts, zero
          # stored blobs), play (visits load, edits flip to honest
          # storage, unchanged re-saves stay contracted via the canon
          # legend), RESTART (fresh registry, same dir — the new server
          # process), reload (edits byte-exact, contracts' canon legends
          # equal a freshly-serialized worldgen form). Disk truth: zero
          # .mca files anywhere — the server's only world copy is the
          # container.
          ./target/release/examples/play_probe 2>&1 | tee bench_play.txt
          grep -q "play worldgen: 16384 chunks saved with the freshness evidence -> 16384 contracts, 0 stored" bench_play.txt || { echo "FAIL: worldgen contracts"; exit 1; }
          grep -q "play session: 169 chunks loaded (contract -> None -> regenerate), 4096 edits (fresh=false) -> 4096 stored, 4096 unchanged re-saves stayed contracted" bench_play.txt || { echo "FAIL: play session"; exit 1; }
          grep -q "play restart: container reopened — 4096 stored + 12288 contracts = 16384 keys" bench_play.txt || { echo "FAIL: restart durability"; exit 1; }
          grep -q "play reload: 4096/4096 edits byte-exact, 12288/12288 contracts regenerate to their worldgen form, 0 lost" bench_play.txt || { echo "FAIL: reload verification"; exit 1; }
          grep -q "play disk truth: 0 .mca files — the server's only world copy is the container" bench_play.txt || { echo "FAIL: disk truth"; exit 1; }
          grep -q "=== play probe: PASS ===" bench_play.txt || { echo "FAIL: verdict"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: play-results
          path: native/bench_play.txt

  jvm-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: build the engine + compile the Java harness
        working-directory: native
        run: |
          cargo build --release
          javac -d ../build/java ../java/dev/crussty/saves/jvmgate/JvmGate.java
      - name: JVM gate — a REAL JVM drives the production natives, restart included (v0.9.61)
        working-directory: native
        run: |
          # The bridge is standard JNI: the JVM resolves Java_dev_crussty_...
          # exports which pass through into natives::n_* — the SAME registry
          # the Paper shim binds. Two separate JVM processes (the new server):
          #   write  — 16,384 chunks, 8 threads, pure JNI byte[] marshalling,
          #            begin/end save barrier (fsync), exit = server death;
          #   verify — fresh JVM reopens the container: every chunk SEMANTIC
          #            through a real NBT parse (every block of every section
          #            on its exact position — the store re-encodes sections
          #            canonically, palette order is semantically neutral),
          #            then a concurrent read burst with latency percentiles.
          H=$(pwd)/target/release/libc_saves.so
          CP=../build/java
          rm -rf /tmp/jvmgate-ci
          java -cp $CP -Dcsaves.lib=$H dev.crussty.saves.jvmgate.JvmGate write /tmp/jvmgate-ci 128 8 2>&1 | tee ../bench_jvm.txt
          java -cp $CP -Dcsaves.lib=$H dev.crussty.saves.jvmgate.JvmGate verify /tmp/jvmgate-ci 128 8 2 2>&1 | tee -a ../bench_jvm.txt
          grep -q "jvm gate: wrote 16384 chunks (8 threads) in" ../bench_jvm.txt || { echo "FAIL: JNI write burst"; exit 1; }
          grep -q "jvm gate: save barrier (begin/end fsync) ok — JVM exits (server death)" ../bench_jvm.txt || { echo "FAIL: save barrier"; exit 1; }
          grep -q "jvm gate: semantic verify 16384/16384 chunks across the restart" ../bench_jvm.txt || { echo "FAIL: semantic reload"; exit 1; }
          grep -q "jvm gate: read burst 32768 JNI reads (8 threads, 2 rounds)" ../bench_jvm.txt || { echo "FAIL: read burst"; exit 1; }
          grep -q "=== jvm gate: write phase PASS ===" ../bench_jvm.txt || { echo "FAIL: write verdict"; exit 1; }
          grep -q "=== jvm gate: PASS ===" ../bench_jvm.txt || { echo "FAIL: verdict"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: jvm-results
          path: bench_jvm.txt

  serve-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build serve probe
        working-directory: native
        run: cargo build --release --example serve_probe
      - name: serve gate — the container IS the world, zero .mca on disk (v0.9.59)
        working-directory: native
        run: |
          # The endgame: Anvil stops being a stored artifact. A vanilla-
          # saved 65,536-chunk world is imported (the import DRAINS the
          # .mca it reads), every chunk is live-edited in place, and the
          # disk must hold ONLY the container from then on. serve_region
          # re-renders every region in memory byte-for-byte identical to
          # the export view; the SERVED bytes re-import into a fresh store
          # and verify chunk-for-chunk (bad=0); serve_chunk — the engine-
          # hook entry — must return exactly the region-slot bytes.
          ./target/release/examples/serve_probe 2>&1 | tee bench_serve.txt
          grep -q "serve world: 64 regions x 1024 chunks = 65536 chunks taken over from vanilla Anvil" bench_serve.txt || { echo "FAIL: world scale"; exit 1; }
          grep -q "serve disk truth: 0 .mca files on disk after takeover + play — the world lives ONLY in the container" bench_serve.txt || { echo "FAIL: disk truth"; exit 1; }
          grep -q "serve identity: 64/64 regions byte-identical to the derived export view" bench_serve.txt || { echo "FAIL: byte identity"; exit 1; }
          grep -q "serve world replay: re-import of the SERVED bytes: 65536 chunks, ok=65536 bad=0" bench_serve.txt || { echo "FAIL: served-world replay"; exit 1; }
          grep -q "serve chunk hook: 1024/1024 sampled entries match the region view byte-for-byte" bench_serve.txt || { echo "FAIL: engine hook framing"; exit 1; }
          grep -q "=== serve probe: PASS ===" bench_serve.txt || { echo "FAIL: verdict"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: serve-results
          path: native/bench_serve.txt

  worst-case-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build worst-case probe
        working-directory: native
        run: cargo build --release --example worst_case_probe
      - name: worst-case gate — EVERY chunk player-edited, zero pristine help (v0.9.55)
        working-directory: native
        run: |
          # The challenge answered: the huge-world arithmetic must not rest
          # on untouched chunks. This probe stores ALL 262,144 chunks
          # through the normal pipeline — phase A with every pristine flag
          # OFF (pure codec: section dedup + zstd, zero contracts exist),
          # phase B as the pristine lifecycle fully colonized (262,144
          # live edits supersede every contract; 0 pristine remain). Both
          # containers are measured after the production maintenance pass
          # and every one of the 262,144 stored chunks is verified
          # SEMANTICALLY against the edited content (the jj verify
          # pattern: per-section expanded state vectors). The in-process
          # gates assert container/anvil < x0.15 on 100% player-modified
          # content (a panic exits non-zero); the greps pin the counts.
          ./target/release/examples/worst_case_probe 2>&1 | tee bench_worst_case.txt
          grep -q "worst-case world: 256 regions x 1024 chunks = 262144 chunks, every chunk player-edited" bench_worst_case.txt || { echo "FAIL: world scale"; exit 1; }
          grep -q "worst-case import A: 262144 stored, 0 contracted, 0 failed (pristine OFF — pure codec, no elision)" bench_worst_case.txt || { echo "FAIL: phase A all-stored"; exit 1; }
          grep -q "worst-case verify A: ok=262144 bad=0" bench_worst_case.txt || { echo "FAIL: phase A verification"; exit 1; }
          grep -q "worst-case ratio gate A: PASS" bench_worst_case.txt || { echo "FAIL: phase A ratio gate"; exit 1; }
          grep -q "worst-case lifecycle: 262144 edits -> 0 pristine remain (every contract superseded by a real edit)" bench_worst_case.txt || { echo "FAIL: full colonization"; exit 1; }
          grep -q "worst-case verify B: ok=262144 bad=0" bench_worst_case.txt || { echo "FAIL: phase B verification"; exit 1; }
          grep -q "worst-case export accounting: 262144 stored + 0 pristine_skipped + 0 lost = 262144 keys" bench_worst_case.txt || { echo "FAIL: export accounting"; exit 1; }
          grep -q "worst-case ratio gate B: PASS" bench_worst_case.txt || { echo "FAIL: phase B ratio gate"; exit 1; }
          grep -q "=== worst-case probe: PASS ===" bench_worst_case.txt || { echo "FAIL: verdict"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: worst-case-results
          path: native/bench_worst_case.txt

  jj-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build jj_profile
        working-directory: native
        run: cargo build --release --example jj_profile
      - name: JJThunder To The Max real-world bench (131-section chunks + 10k entities)
        working-directory: native
        run: |
          ./target/release/examples/jj_profile ../bench-corpus/dim 2>/dev/null | tee jj_bench.txt
          cat jj_bench.txt
      - name: gate — semantic verify clean, container under 50% of Anvil
        working-directory: native
        run: |
          grep -q "verify: ok=" jj_bench.txt || { echo "FAIL: no verification line"; exit 1; }
          BAD=$(grep "verify:" jj_bench.txt | grep -o "bad=[0-9]*" | head -1 | cut -d= -f2)
          [ "$BAD" = "0" ] || { echo "FAIL: semantic verification bad=$BAD"; exit 1; }
          RATIO=$(grep "^TOTAL" jj_bench.txt | grep -o "x[0-9.]* smaller" | grep -o "[0-9.]*")
          echo "container is ${RATIO}x smaller than Anvil on the JJThunder corpus"
          awk -v r="$RATIO" 'BEGIN { if (r+0 < 2.6) { print "FAIL: ratio below 2.6x"; exit 1 } print "OK" }'
      - uses: actions/upload-artifact@v4
        with:
          name: jj-bench-results
          path: native/jj_bench.txt

  survival-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build survival bench
        working-directory: native
        run: cargo build --release --example survival_bench
      - name: realistic survival-world size bench (32x32 chunks, skylight + chests + farms)
        working-directory: native
        run: |
          ./target/release/examples/survival_bench 16 12 2>&1 | tee survival_bench.txt
          cat survival_bench.txt
      - name: record size/stall summary
        working-directory: native
        run: grep -E "import\+pack|TOTAL|region :|entities:|verify|profile|enc-modes|weights" survival_bench.txt | tee survival_stalls.txt
      - name: gate — verify clean + survival-world size floor
        working-directory: native
        run: |
          grep -q "verify: ok=" survival_bench.txt || { echo "FAIL: no verify line"; exit 1; }
          BAD=$(grep "verify:" survival_bench.txt | grep -o "bad=[0-9]*" | head -1 | cut -d= -f2)
          [ "$BAD" = "0" ] || { echo "FAIL: semantic verification bad=$BAD"; exit 1; }
          RATIO=$(grep "^TOTAL" survival_bench.txt | grep -o "x[0-9.]* smaller" | grep -o "[0-9.]*")
          echo "survival corpus: ${RATIO}x smaller than Anvil"
          awk -v r="$RATIO" 'BEGIN { if (r+0 < 3.0) { print "FAIL: ratio below 3.0x"; exit 1 } print "OK" }'
      - uses: actions/upload-artifact@v4
        with:
          name: survival-bench-results
          path: |
            native/survival_bench.txt
            native/survival_stalls.txt

  survival-exp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build survival_exp
        working-directory: native
        run: cargo build --release --example survival_exp
      - name: survival attribution + codec-lever prediction (48x48 chunks)
        working-directory: native
        run: |
          ./target/release/examples/survival_exp 24 2>&1 | tee survival_exp.txt
          cat survival_exp.txt
      - uses: actions/upload-artifact@v4
        with:
          name: survival-exp-results
          path: native/survival_exp.txt

  real-exp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build real_exp
        working-directory: native
        run: |
          cargo build --release --example real_exp
          cargo build --release --example jj_exp4
      - name: real-corpus attribution (committed JJThunder subset)
        working-directory: native
        run: |
          ./target/release/examples/real_exp ../bench-corpus/dim 2>&1 | tee real_exp.txt
          cat real_exp.txt
          echo "--- cross-chunk dense-delta potential (jj_exp4) ---"
          ./target/release/examples/jj_exp4 ../bench-corpus/dim 2>&1 | tee jj_exp4.txt
          cat jj_exp4.txt
      - uses: actions/upload-artifact@v4
        with:
          name: real-exp-results
          path: |
            native/real_exp.txt
            native/jj_exp4.txt

  speed-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build speed_bench
        working-directory: native
        run: cargo build --release --example speed_bench
      - name: I/O speed benchmark (real JJThunder corpus, Anvil vs c-saves)
        working-directory: native
        run: |
          ./target/release/examples/speed_bench ../bench-corpus/dim 3 2 2>/dev/null | tee speed_bench.txt
          cat speed_bench.txt
      - name: record all stall points (latency percentiles + per-stage breakdown)
        working-directory: native
        run: |
          grep -E "^SPEED" speed_bench.txt | tee speed_stalls.txt
      - name: gates — verify clean + throughput/latency floors (3 attempts; hosted runners have noisy neighbors — one clean attempt passes)
        working-directory: native
        run: |
          set -e
          cat > /tmp/gate.sh <<'GEOF'
          set -e
          BADS=$(grep -oE "verify-[a-z]+: ok=[0-9]+ bad=[0-9]+" speed_bench.txt | grep -oE "bad=[0-9]+" | cut -d= -f2)
          for b in $BADS; do [ "$b" = "0" ] || { echo "FAIL: semantic verify bad=$b"; exit 1; }; done
          mbps() { grep "$1" speed_bench.txt | grep -oE "MB/s=[0-9.]+" | head -1 | cut -d= -f2; }
          us() { grep "$1" speed_bench.txt | grep -oE "p50=[0-9.]+" | head -1 | cut -d= -f2; }
          AREAD=$(mbps "anvil-read-region");       CREAD=$(mbps "csaves-read-warm-region")
          AWR_E=$(mbps "anvil-write-entities");    CWR_E=$(mbps "csaves-write-steady-entities")
          CIMP=$(mbps "csaves-import-region");     CWR=$(mbps "csaves-write-steady-region")
          RP50=$(us "csaves-read-warm-region")
          echo "anvil-read=${AREAD} csaves-read=${CREAD} csaves-import-region=${CIMP} csaves-write-region=${CWR} anvil-write-ent=${AWR_E} csaves-write-ent=${CWR_E} read-p50=${RP50}us"
          awk -v r="$CIMP"  'BEGIN { if (r+0 < 25)  { print "FAIL: region import " r " MB/s < 25"; exit 1 } }'
          awk -v r="$CWR"   'BEGIN { if (r+0 < 30)  { print "FAIL: region steady write " r " MB/s < 30"; exit 1 } }'
          # relative floor with an absolute backstop: the warm read must stay
          # at 0.8x of anvil-inflate on the SAME run (same runner state) —
          # v0.9.8's canon cache put it at ~1.5x; before that fix it sat at
          # 0.25x, hidden by the old 100 MB/s backstop. The backstop only
          # catches a true collapse when anvil is slow too.
          awk -v c="$CREAD" -v a="$AREAD" 'BEGIN { if (c+0 < a*0.8 && c+0 < 100) { print "FAIL: region warm read " c " MB/s < max(0.8x anvil " a ", 100)"; exit 1 } }'
          awk -v r="$RP50"  'BEGIN { if (r+0 > 40)  { print "FAIL: read p50 " r "us > 40us"; exit 1 } }'
          awk -v c="$CWR_E" -v a="$AWR_E" 'BEGIN { if (c+0 < a*4) { print "FAIL: entity write " c " MB/s < 4x anvil " a; exit 1 } }'
          echo "speed gates OK"
          GEOF
          rc=1
          for attempt in 1 2 3; do
            echo "== speed bench attempt $attempt =="
            ./target/release/examples/speed_bench ../bench-corpus/dim 3 2 2>/dev/null | tee speed_bench.txt
            if bash /tmp/gate.sh; then rc=0; break; fi
            echo "attempt $attempt failed gates (runner noise?) — retrying"
          done
          grep -E "^SPEED" speed_bench.txt | tee speed_stalls.txt
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: speed-bench-results
          path: |
            native/speed_bench.txt
            native/speed_stalls.txt

  paper-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: build the engine + the offline probe
        working-directory: native
        run: |
          cargo build --release
          cargo build --release --example paper_probe
      - name: fetch paperclip 26.3 and boot once to produce the mapped server jar
        run: |
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -sL "$URL" -o paper.jar
          mkdir patchrun && cd patchrun
          echo "eula=true" > eula.txt
          printf "online-mode=false\nview-distance=2\nsimulation-distance=2\ngenerate-structures=false\nmotd=csaves\n" > server.properties
          java -Xms512M -Xmx1500M -jar ../paper.jar nogui > boot.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 150); do
            if grep -q "Done (" boot.log 2>/dev/null; then OK=1; break; fi
            sleep 2
          done
          [ "$OK" = 1 ] || { echo "FAIL: server never reached Done"; tail -40 boot.log; exit 1; }
          kill -INT $PID; wait $PID || true
          grep -q "Starting minecraft server version 26.3" boot.log
          ls versions/26.3/paper-26.3.jar
      - name: compile the agent against the REAL mapped server jar
        run: |
          MAPPED=patchrun/versions/26.3/paper-26.3.jar
          mkdir -p build/agent
          javac -cp "$MAPPED:cplug-sdk/asm-lib/asm-9.11.1.jar" -d build/agent $(find agent/src -name "*.java")
          cp cplug-sdk/asm-lib/asm-9.11.1.jar build/agent/
          cd build/agent
          printf "Premain-Class: dev.crussty.saves.agent.CrusstyAgent\nClass-Path: asm-9.11.1.jar\nCan-Retransform-Classes: true\n" > manifest.txt
          jar --create --file agent.jar --manifest manifest.txt -C . dev
      - name: THE LIVE SESSION — a REAL Paper 26.3 server plays from the container (v0.9.62)
        run: |
          set -euo pipefail
          ROOT=$PWD
          CP="patchrun/versions/26.3/paper-26.3.jar:$(find patchrun/libraries -name '*.jar' | tr '\n' ':')build/agent/asm-9.11.1.jar"
          AGENT="-javaagent:$ROOT/build/agent/agent.jar -Dcsaves.lib=$ROOT/native/target/release/libc_saves.so"
          mkdir live && cd live
          cp ../patchrun/eula.txt .
          cp ../patchrun/server.properties .

          check_stats() { # $1=min_writeOk $2=min_served
            tail -n 1 stats-live.txt | python3 -c "import re,sys; m={k:int(v) for k,v in re.findall(r'(\w+)=(\d+)', sys.stdin.read())}; print('stats:', m); sys.exit(0 if m.get('writeOk',0)>=$1 and m.get('served',0)>=$2 and m.get('writeFail',1)==0 and m.get('vanillaFallback',1)==0 else 1)"
          }
          no_mca() {
            MCA=$(find . -name "*.mca" | wc -l)
            [ "$MCA" = 0 ] || { echo "FAIL: $MCA .mca files on disk"; exit 1; }
            echo "disk truth: 0 .mca files"
          }

          # ---- run 1: the world is BORN into the container (spawn worldgen) ----
          ( sleep 40; echo stop ) | timeout --signal=INT 220 \
            java -Xms512M -Xmx1500M $AGENT -Dcsaves.statsfile=stats-live.txt \
            -cp "$CP" org.bukkit.craftbukkit.Main nogui > run1.log 2>&1 || true
          grep -q "Done (" run1.log || { echo "FAIL run1: no Done"; tail -40 run1.log; exit 1; }
          grep -q "patched net/minecraft/world/level/chunk/storage/RegionFileStorage: 7/7 methods" run1.log
          for c in ChunkDataController EntityDataController PoiDataController; do
            grep -q "patched ca/spottedleaf/moonrise/patches/chunk_system/io/datacontroller/$c: 1/1 methods" run1.log
          done
          echo "patch gates OK (RegionFileStorage 7/7, controllers 1/1 x3)"
          check_stats 1 0
          no_mca

          # ---- run 2: force-load forces READS from the container ----
          ( sleep 35; echo "forceload add -8 8"; sleep 90; echo stop ) | timeout --signal=INT 220 \
            java -Xms512M -Xmx1500M $AGENT -Dcsaves.statsfile=stats-live.txt \
            -cp "$CP" org.bukkit.craftbukkit.Main nogui > run2.log 2>&1 || true
          grep -q "Done (" run2.log || { echo "FAIL run2: no Done"; tail -40 run2.log; exit 1; }
          check_stats 0 1
          no_mca
          echo "read gate OK: the server loaded chunks from the container on a cold restart"

          # ---- run 3: a LIVE EDIT through the server console ----
          ( sleep 35; echo "forceload add 0 0"; sleep 15; echo "setblock 0 -60 0 minecraft:diamond_block"; sleep 45; echo stop ) | timeout --signal=INT 220 \
            java -Xms512M -Xmx1500M $AGENT -Dcsaves.statsfile=stats-live.txt \
            -cp "$CP" org.bukkit.craftbukkit.Main nogui > run3.log 2>&1 || true
          grep -q "Changed the block at 0, -60, 0" run3.log || { echo "FAIL run3: setblock"; grep -F "System chat" run3.log | head -5; exit 1; }
          no_mca
          echo "edit gate OK: the edit went into the container (nothing else exists)"

          # ---- run 4: the edit survives a restart — read back from the container ----
          ( sleep 35; echo "forceload add -8 8"; sleep 90; echo stop ) | timeout --signal=INT 220 \
            java -Xms512M -Xmx1500M $AGENT -Dcsaves.statsfile=stats-live.txt \
            -cp "$CP" org.bukkit.craftbukkit.Main nogui > run4.log 2>&1 || true
          grep -q "Done (" run4.log || { echo "FAIL run4: no Done"; tail -40 run4.log; exit 1; }
          check_stats 0 1
          no_mca

          # ---- offline ground truth: the container holds the edit, zero .mca ----
          "$ROOT/native/target/release/examples/paper_probe" \
            world/dimensions/minecraft/overworld/c-saves/region --diamond | tee paper_probe.txt
          grep -q "read_ok=.* bad=0" paper_probe.txt
          grep -q "diamond_block=PRESENT" paper_probe.txt
          grep -q "=== paper probe: PASS ===" paper_probe.txt
          echo "=== paper bench: PASS — the server plays from the container, end to end ==="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-results
          path: |
            live/run1.log
            live/run2.log
            live/run3.log
            live/run4.log
            live/stats-live.txt
            live/paper_probe.txt
            patchrun/boot.log
