name: bigworld-survival

# 512x512-chunk REAL SURVIVAL-world benchmark:
# vanilla terrain generation (no datapack) on 16 parallel tile runners,
# then one bench job merges the tiles, scatters realistic loot chests
# (block entities with Items NBT), spawns the 20k entity corpus and
# measures Anvil vs c-saves with full per-component attribution.

on:
  workflow_dispatch:
    inputs:
      seed_run_id:
        description: 'run id whose tile artifacts to seed from (resume)'
        required: false
        default: ''
      chests:
        description: 'loot chests to scatter'
        required: false
        default: '2000'

jobs:
  tile:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      matrix:
        tx: [0, 1, 2, 3]
        tz: [0, 1, 2, 3]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: download Paper 26.3 (vanilla terrain, no datapack)
        run: |
          mkdir -p jjserver && cd jjserver
          curl -sL -o paper.jar "https://fill-data.papermc.io/v1/objects/416b7d105b1d0192df4afa4b29d2800d9dbeda092a82fbc5b511248a54adde15/paper-26.3-227.jar"
          echo "416b7d105b1d0192df4afa4b29d2800d9dbeda092a82fbc5b511248a54adde15  paper.jar" | sha256sum -c -
          mkdir -p config
          echo "eula=true" > eula.txt
          printf 'rcon.port=25575\nrcon.password=jjbench2026\nenable-rcon=true\nlevel-seed=77007\nonline-mode=false\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\nsync-chunk-writes=true\nlevel-name=jjworld\n' > server.properties
          printf '_version: 29\nwatchdog:\n  enable: false\n' > config/paper-global.yml

      - name: seed from previous run (resume)
        if: inputs.seed_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: jjserver
        run: |
          mkdir -p seed
          gh run download ${{ inputs.seed_run_id }} -n "tile-${{ matrix.tx }}-${{ matrix.tz }}" -D seed || echo "no seed artifact"

      - name: generate tile (vanilla worldgen)
        working-directory: jjserver
        run: |
          TX=${{ matrix.tx }}
          TZ=${{ matrix.tz }}
          X1=$((TX * 128 - 256))
          Z1=$((TZ * 128 - 256))
          X2=$((X1 + 127))
          Z2=$((Z1 + 127))
          echo "tile ($TX,$TZ) = chunks [$X1..$X2] x [$Z1..$Z2]"
          SEED_ARG=""
          if [ -d ../seed/region ]; then SEED_ARG=../seed/region; fi
          if [ -d seed/region ]; then SEED_ARG=seed/region; fi
          python3 ../scripts/jj/gen_tile.py $X1 $Z1 $X2 $Z2 7800 $SEED_ARG

      - name: collect owned region files
        if: always()
        working-directory: jjserver
        run: |
          TX=${{ matrix.tx }}
          TZ=${{ matrix.tz }}
          X1=$((TX * 128 - 256))
          Z1=$((TZ * 128 - 256))
          RX1=$((X1 >> 5)); RX2=$((RX1 + 3))
          RZ1=$((Z1 >> 5)); RZ2=$((RZ1 + 3))
          mkdir -p artifact/region
          for rx in $(seq $RX1 $RX2); do
            for rz in $(seq $RZ1 $RZ2); do
              F="jjworld/dimensions/minecraft/overworld/region/r.$rx.$rz.mca"
              if [ -f "$F" ]; then cp "$F" artifact/region/; else echo "missing r.$rx.$rz.mca"; fi
            done
          done
          du -sh artifact

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tile-${{ matrix.tx }}-${{ matrix.tz }}
          path: jjserver/artifact
          retention-days: 3

  bench:
    needs: tile
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable

      - name: download 16 tile artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tx in 0 1 2 3; do
            for tz in 0 1 2 3; do
              gh run download $GITHUB_RUN_ID -n "tile-$tx-$tz" -D "art/tile-$tx-$tz"
            done
          done
          ls art

      - name: merge into one world
        run: |
          R=jjserver/jjworld/dimensions/minecraft/overworld/region
          mkdir -p "$R"
          for d in art/tile-*; do
            if ls "$d"/region/*.mca >/dev/null 2>&1; then
              cp "$d"/region/*.mca "$R"/
            fi
          done
          COUNT=$(ls "$R" | wc -l)
          echo "region files: $COUNT (expect 256 = 16 tiles x 16 region files)"
          [ "$COUNT" = "256" ] || echo "::warning::expected 256 region files, got $COUNT"

      - name: enrich merged world (chests + entities, no server needed)
        run: |
          cd native
          cargo build --release --example enrich
          ./target/release/examples/enrich \
            ../jjserver/jjworld/dimensions/minecraft/overworld 2000 20000 250
          du -sh ../jjserver/jjworld/dimensions/minecraft/overworld/* || true

      - name: build + run the comparison + class attribution
        run: |
          cd native
          cargo build --release --example big_profile
          cargo build --release --example real_exp
          CSAVES_VERIFY_SAMPLE=10 ./target/release/examples/big_profile \
            ../jjserver/jjworld/dimensions/minecraft/overworld 2>jj_err.txt | tee surv_big.txt
          grep -E "^TOTAL|verify:" surv_big.txt
          BAD=$(grep "verify:" surv_big.txt | grep -o "bad=[0-9]*" | cut -d= -f2)
          [ "$BAD" = "0" ] || { echo "FAIL: semantic verification bad=$BAD"; exit 1; }
          ./target/release/examples/real_exp \
            ../jjserver/jjworld/dimensions/minecraft/overworld 2>real_exp_err.txt | tee real_exp.txt

      - name: verdict
        run: |
          grep -E "chunks:|region :|entities:|TOTAL|verify:|weights|CLASS" native/surv_big.txt || true
          RATIO=$(grep "^TOTAL" native/surv_big.txt | grep -o "x[0-9.]* smaller" | grep -o "[0-9.]*")
          echo "=== 512x512 REAL SURVIVAL world: c-saves container is ${RATIO}x smaller than Anvil ==="

      - uses: actions/upload-artifact@v4
        with:
          name: bigworld-survival-results
          path: |
            native/surv_big.txt
            native/real_exp.txt
            native/jj_err.txt
          retention-days: 30
